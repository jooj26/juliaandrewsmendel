<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #fce4ec;
            color: #000000;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            padding: 20px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            cursor: pointer;
            min-height: 200px;
            background-color: #f5f5f5;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 0.9em;
        }

        .gallery-item .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 0.9em;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 0.45em;
            font-size: 2em;
            margin-bottom: 2em;
            text-align: center;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        /* Menu Styles */
        .menu-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-dots {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .menu-dots::before,
        .menu-dots::after,
        .menu-dots span {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .menu-dots::before {
            top: 6px;
            left: calc(50% - 10px);
        }

        .menu-dots span {
            top: 6px;
            left: calc(50% + 4px);
        }

        .menu-dots::after {
            top: 19px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-container {
            position: fixed;
            bottom: 70px;
            left: 20px;
            background: rgba(252, 228, 236, 0.95);
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .menu-button:hover + .menu-container,
        .menu-container:hover {
            opacity: 1;
            visibility: visible;
        }

        .menu-container a {
            display: block;
            padding: 8px 20px;
            color: #000;
            text-decoration: none;
            font-size: 1.1em;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        .menu-container a:hover {
            transform: translateX(5px);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(252, 252, 252, 0.95);
            z-index: 2000;
            overflow: auto;
        }

        .modal-content {
            position: relative;
            margin: auto;
            padding: 20px;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .close-button::before,
        .close-button::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 30px;
            background-color: #000;
            top: 50%;
            left: 50%;
        }

        .close-button::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .close-button::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
    </style>
</head>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.querySelector('.modal-image');
        const galleryItems = document.querySelectorAll('.gallery-item img');

        galleryItems.forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'block';
                modalImg.src = img.dataset.full;
                modalImg.alt = img.alt;
                document.body.style.overflow = 'hidden';
            });
        });

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>

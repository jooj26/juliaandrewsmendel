    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            margin: 0;
            padding: 0;
            background-color: #d4d8dc;
            color: #000000;
            overflow: hidden;
        }

        h1 {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 300;
            letter-spacing: 0.45em;
            font-size: 2em;
            margin: 0;
            z-index: 10;
            pointer-events: none;
        }

        .scroll-wrapper {
            position: relative;
            height: 100vh;
        }

        .sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .gallery-track {
            display: flex;
            align-items: center;
            gap: 60px;
            padding: 0 10vw;
            will-change: transform;
        }

        .gallery-item {
            flex-shrink: 0;
            height: 70vh;
            cursor: pointer;
            background-color: #f5f5f5;
            position: relative;
        }

        .gallery-item img {
            height: 100%;
            width: auto;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 0.9em;
            white-space: nowrap;
        }

        .gallery-item .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 0.9em;
            text-align: center;
            padding: 20px;
        }

        /* Menu Styles */
        .menu-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-dots {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .menu-dots::before,
        .menu-dots::after,
        .menu-dots span {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .menu-dots::before {
            top: 6px;
            left: calc(50% - 10px);
        }

        .menu-dots span {
            top: 6px;
            left: calc(50% + 4px);
        }

        .menu-dots::after {
            top: 19px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-container {
            position: fixed;
            bottom: 70px;
            left: 20px;
            background: rgba(212, 216, 220, 0.95);
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .menu-button:hover + .menu-container,
        .menu-container:hover {
            opacity: 1;
            visibility: visible;
        }

        .menu-container a {
            display: block;
            padding: 8px 20px;
            color: #000;
            text-decoration: none;
            font-size: 1.1em;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        .menu-container a:hover {
            transform: translateX(5px);
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(212, 216, 220, 0.6) 70%, #d4d8dc 100%);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(252, 252, 252, 0.95);
            z-index: 2000;
            overflow: auto;
        }

        .modal-content {
            position: relative;
            margin: auto;
            padding: 20px;
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-image {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .close-button::before,
        .close-button::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 30px;
            background-color: #000;
            top: 50%;
            left: 50%;
        }

        .close-button::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .close-button::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
    </style>
</head>

    <script>
        const track = document.getElementById('galleryTrack');
        const modal = document.getElementById('imageModal');
        const modalImg = document.querySelector('.modal-image');

        let scrollX = 0;

        function getMaxScroll() {
            return Math.max(0, track.scrollWidth - window.innerWidth);
        }

        function applyScroll(delta) {
            scrollX = Math.max(0, Math.min(getMaxScroll(), scrollX + delta));
            track.style.transform = `translateX(${-scrollX}px)`;
        }

        // Intercept wheel events so vertical trackpad scroll drives the gallery
        // horizontally instead of jerkily nudging the page.
        document.addEventListener('wheel', (e) => {
            if (modal.style.display === 'block') return;
            e.preventDefault();
            const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            applyScroll(delta);
        }, { passive: false });

        window.addEventListener('resize', () => {
            scrollX = Math.min(scrollX, getMaxScroll());
            track.style.transform = `translateX(${-scrollX}px)`;
        }, { passive: true });

        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.addEventListener('click', () => {
                modal.style.display = 'block';
                modalImg.src = img.dataset.full;
                modalImg.alt = img.alt;
            });
        });

        function closeModal() {
            modal.style.display = 'none';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julia Andrews Mendel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #fcfcfc;
            position: relative;
            overflow: hidden;
        }
        
        /* Noise texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .featured-image {
            position: absolute;
            width: 45vw;
            height: 65vh;
            object-fit: cover;
            right: 15vw;
            bottom: 10vh;
            mix-blend-mode: darken;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #000000;
            position: absolute;
            font-weight: 300;
            letter-spacing: 0.45em;
            z-index: 2;
        }

        .julia {
            top: 0;
            right: 20px;
        }

        .andrews {
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
        }

        .mendel {
            top: 50%;
            left: 20px;
        }

        p {
            font-size: 1.2em;
            color: #000000;
        }

        .arc {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Menu Styles */
        .menu-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-dots {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .menu-dots::before,
        .menu-dots::after,
        .menu-dots span {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .menu-dots::before {
            top: 6px;
            left: calc(50% - 10px);
        }

        .menu-dots span {
            top: 6px;
            left: calc(50% + 4px);
        }

        .menu-dots::after {
            top: 19px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-container {
            position: fixed;
            bottom: 70px;
            left: 20px;
            background: rgba(252, 252, 252, 0.95);
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .menu-button:hover + .menu-container,
        .menu-container:hover {
            opacity: 1;
            visibility: visible;
        }

        .menu-container a {
            display: block;
            padding: 8px 20px;
            color: #000;
            text-decoration: none;
            font-size: 1.1em;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        .menu-container a:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <svg class="arc" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M 0,100 Q 50,0 100,0" stroke="black" stroke-width="0.02" fill="none"/>
    </svg>
    <div class="container">
        <img class="featured-image" src="drawing.png" alt="abstract drawing 11th april 2025 by Julia Andrews Mendel">
        <h1 class="julia">Julia</h1>
        <h1 class="andrews">Andrews</h1>
        <h1 class="mendel">Mendel</h1>
    </div>
    
    <button class="menu-button">
        <div class="menu-dots">
            <span></span>
        </div>
    </button>
    <nav class="menu-container">
        <a href="cv.html">CV</a>
        <a href="images.html">Images</a>
        <a href="contact.html">Contact</a>
    </nav>
</body>
</html>

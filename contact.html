<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Julia Andrews Mendel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #e8d5c5;
            color: #000000;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 0.45em;
            font-size: 2em;
            margin-bottom: 2em;
            text-align: center;
        }

        .contact-info {
            text-align: center;
            line-height: 2;
            font-size: 1.2em;
            letter-spacing: 0.1em;
        }

        .contact-info a {
            color: #000;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .contact-info a:hover {
            opacity: 0.7;
        }

        .menu-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-dots {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .menu-dots::before,
        .menu-dots::after,
        .menu-dots span {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .menu-dots::before {
            top: 6px;
            left: calc(50% - 10px);
        }

        .menu-dots span {
            top: 6px;
            left: calc(50% + 4px);
        }

        .menu-dots::after {
            top: 19px;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-container {
            position: fixed;
            bottom: 70px;
            left: 20px;
            background: rgba(232, 213, 197, 0.95);
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .menu-button:hover + .menu-container,
        .menu-container:hover {
            opacity: 1;
            visibility: visible;
        }

        .menu-container a {
            display: block;
            padding: 8px 20px;
            color: #000;
            text-decoration: none;
            font-size: 1.1em;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }

        .menu-container a:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact</h1>
        
        <div class="contact-info">
            <p>
                <a href="mailto:jmimendel@gmail.com">jmimendel@gmail.com</a>
            </p>
            <p>
                <a href="https://www.instagram.com/a.floating.piece.of.space/" target="_blank" rel="noopener">@a.floating.piece.of.space</a>
            </p>
        </div>
    </div>

    <button class="menu-button">
        <div class="menu-dots">
            <span></span>
        </div>
    </button>
    <nav class="menu-container">
        <a href="index.html">Home</a>
        <a href="cv.html">CV</a>
        <a href="images.html">Images</a>
        <a href="contact.html">Contact</a>
    </nav>
</body>
</html>
